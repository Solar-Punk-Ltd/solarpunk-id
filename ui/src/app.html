<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Create and manage your decentralized identity with Ethereum or Passkey. Sync across devices with Swarm network."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Swarm Identity" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <!--
      Painted before any script or stylesheet of the app loads, which from
      Swarm takes seconds: the theme's background and a Swarm loader, which
      the app takes away once it has something to show
      (src/lib/loading-screen.ts), and a line under it after 30 seconds that
      says the wait runs long. The theme is picked by the theme store's
      rule (src/lib/stores/theme.svelte.ts). A framed page, the hidden session
      frame or a site's button, shows neither.
    -->
    <style>
      html {
        background: oklch(1 0 0);
        color-scheme: light;
      }
      html.dark {
        background: oklch(0.145 0 0);
        color-scheme: dark;
      }
      html.framed {
        background: transparent;
        color-scheme: normal;
      }
      #swarm-id-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(1 0 0);
        color: oklch(0.145 0 0);
      }
      html.dark #swarm-id-loading {
        background: oklch(0.145 0 0);
        color: oklch(0.985 0 0);
      }
      html.framed #swarm-id-loading {
        display: none;
      }
      #swarm-id-loading svg {
        animation: swarm-id-loading-pulse 1.6s ease-in-out infinite;
      }
      @keyframes swarm-id-loading-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      #swarm-id-loading-slow {
        position: absolute;
        top: calc(50% + 2.5rem);
        right: 0;
        left: 0;
        margin: 0;
        padding: 0 1rem;
        font:
          0.875rem/1.4 system-ui,
          sans-serif;
        text-align: center;
      }
      .swarm-id-loading-words {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        #swarm-id-loading svg {
          animation: none;
        }
      }
    </style>
    <script>
      ;(function () {
        var root = document.documentElement.classList
        var stored
        try {
          stored = localStorage.getItem('swarm-id-theme')
        } catch (error) {
          stored = null
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) root.add('dark')
        if (window.self !== window.top) root.add('framed')

        var SLOW_AFTER_MS = 30000
        window.setTimeout(function () {
          var slowLine = document.getElementById('swarm-id-loading-slow')
          if (slowLine) slowLine.textContent = 'Swarm ID is taking longer than usual.'
        }, SLOW_AFTER_MS)
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="swarm-id-loading" role="status">
      <svg viewBox="0 0 30 30" width="48" height="48" fill="currentColor" aria-hidden="true">
        <path
          d="M0 17.8927V25.9641L6.97471 30L13.9494 25.9639V17.8913L6.97471 13.8565L0 17.8927Z"
        />
        <path
          d="M15.9609 17.8923V25.9638L22.9357 29.9999L29.9104 25.9638V17.891L22.9357 13.8564L15.9609 17.8923Z"
        />
        <path
          d="M21.9251 8.07901L18.4402 6.05435L18.4367 2.01901L14.9552 0L7.98535 4.03614V12.1076L14.9552 16.1435L21.9251 12.1076V8.07901Z"
        />
        <path
          d="M21.925 8.07901L25.4099 6.053V2.01794L21.9303 0L18.4365 2.01901L21.9303 4.03238L21.925 8.07901Z"
        />
      </svg>
      <span class="swarm-id-loading-words">Loading Swarm ID</span>
      <p id="swarm-id-loading-slow"></p>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
